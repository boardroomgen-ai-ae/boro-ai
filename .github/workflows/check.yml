name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Credentials, personal data and internal identifiers
        run: node scripts/check-no-secrets.mjs
