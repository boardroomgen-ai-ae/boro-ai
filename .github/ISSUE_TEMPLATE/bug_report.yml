name: Bug report
description: Something in the docs, an example, the MCP server or the REST API does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here. Report it privately: **Security** tab → **Report a vulnerability** (see SECURITY.md).
        **Never paste a real API key, MCP token, phone number, e-mail or customer data.** Replace them with placeholders.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP server
        - REST API v1
        - Website chat widget
        - Example (curl / JS / Python)
        - n8n or Make template
        - Documentation
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      description: e.g. Claude Desktop 1.x, Cursor 2.x, Node 22, n8n 1.x
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the error code from the response (e.g. scope_denied, INVALID_KEY), not the full payload.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use YOUR_API_KEY / YOUR_MCP_TOKEN placeholders.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed all keys, tokens and personal data from this report.
          required: true
