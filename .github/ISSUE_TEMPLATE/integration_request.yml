name: Integration request
description: Ask for a connector to a CRM, booking system, messenger, telephony, accounting or ads platform.
labels: ["integration"]
body:
  - type: input
    id: system
    attributes:
      label: Which system
      placeholder: e.g. a booking system, a regional CRM, an accounting service
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Category
      options:
        - CRM
        - Booking / scheduling
        - Messenger / channel
        - Telephony / voice
        - Accounting / invoicing
        - Advertising
        - E-commerce
        - Other
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: What should flow, and in which direction
      description: e.g. "new bookings from X become deals; the agent can offer free slots from X".
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the system's public API docs (if any)
  - type: input
    id: region
    attributes:
      label: Country / region where you use it
  - type: dropdown
    id: urgency
    attributes:
      label: How many businesses would use it
      options:
        - Just mine
        - Several of my clients (I'm a partner / agency)
        - It's the standard tool in my industry or region
